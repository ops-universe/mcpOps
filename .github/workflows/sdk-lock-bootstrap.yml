name: SDK lockfile bootstrap
on:
  push:
    branches: [feat/trusted-sdk-evidence]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdk-integration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned public SDK dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Output generated lockfile
        run: |
          echo MCPOPS_LOCK_BEGIN
          cat package-lock.json
          echo MCPOPS_LOCK_END
